<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamiento de horas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <custom-navbar></custom-navbar>

    <main class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4">
                            Agendamiento de hora médica</h1>

                        <div class="mb-3">
                            <label for="input-run-paciente" class="form-label">
                                RUN del paciente
                            </label>
                            <input type="text" id="input-run-paciente" class="form-control"
                                placeholder="Ingrese RUN sin puntos ni guion">

                        </div>

                        <div class="mb-3">
                            <label for="input-nombre-paciente" class="form-label">
                                Nombre del paciente
                            </label>
                            <input type="text" id="input-nombre-paciente" class="form-control"
                                placeholder="Ingrese el nombre del paciente">

                        </div>

                        <div class="mb-3">
                            <label for="select-especialidad" class="form-label">
                                Especialidad
                            </label>
                            <select id="select-especialidad" class="form-select">
                                <option value="">
                                    Seleccione una especialidad
                                </option>

                                <option value="medicina-general">
                                    Medicina general
                                </option>

                                <option value="pediatria">
                                    Pediatría
                                </option>

                                <option value="neurologia">
                                    Neurología
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">
                            <label for="select-medico" class="form-label">
                                Médico
                            </label>

                            <select id="select-medico" class="form-select">

                                <option value="">
                                    Seleccione un médico
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="input-fecha-hora" class="form-label">
                                Fecha
                            </label>
                            <input type="date" id="input-fecha-hora" class="form-control">
                        </div>

                        <div class="mb-4">

                            <label for="select-hora" class="form-label">
                                Hora
                            </label>

                            <select id="select-hora" class="form-select">

                                <option value="">
                                    Seleccione una hora
                                </option>

                                <option value="09:00">
                                    09:00
                                </option>

                                <option value="10:00">
                                    10:00
                                </option>

                                <option value="11:00">
                                    11:00
                                </option>

                                <option value="12:00">
                                    12:00
                                </option>

                                <option value="15:00">
                                    15:00
                                </option>

                            </select>

                        </div>

                        <button type="button" id="btn-agendar" class="btn btn-blondie w-100">
                            Agendar hora
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <custom-footer></custom-footer>

    <script src="js/agendar-hora.js"></script>

    <script src="js/componentes/navbar.js"></script>
    <script src="js/componentes/footer.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
